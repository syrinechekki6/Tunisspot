{% extends 'base.html' %}

{% block title %}Ajouter une station - TunisSpot{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
    <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200">
        <h1 class="text-xl font-black text-slate-900 mb-1">Ajouter une station de transport</h1>
        <p class="text-xs text-slate-500 mb-6">Ajoutez une station au réseau TGM ou Métro léger de Tunis.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nom de la station *</label>
                <input type="text" name="nom" required placeholder="Ex: Carthage Présidence" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Type de transport *</label>
                <select name="type" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                    <option value="TGM">TGM</option>
                    <option value="METRO">Métro Léger</option>
                    <option value="BUS">Bus</option>
                    <option value="TRAIN">Train de banlieue</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ligne associée</label>
                <select name="ligne" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                    <option value="">-- Aucune / Indépendante --</option>
                    {% for l in lignes %}
                    <option value="{{ l.id }}">{{ l.nom }} ({{ l.code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Latitude</label>
                    <input type="number" step="0.0001" name="latitude" value="36.8700" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Longitude</label>
                    <input type="number" step="0.0001" name="longitude" value="10.3400" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                </div>
            </div>
            <div class="flex items-center justify-end space-x-3 pt-6 border-t border-slate-100">
                <a href="{% url 'transports:comparator' %}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600">Annuler</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow">Créer la station</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
