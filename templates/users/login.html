{% extends 'base.html' %}

{% block title %}Connexion - TunisSpot{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-200">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-teal-600 text-white flex items-center justify-center mx-auto text-xl mb-3 shadow-md">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900">Connexion à TunisSpot</h2>
            <p class="text-xs text-slate-500 mt-1">Accédez à votre passeport, vos favoris et vos itinéraires</p>
        </div>

        <form method="POST" class="space-y-4" autocomplete="off">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nom d'utilisateur</label>
                <input type="text" name="username" required autofocus autocomplete="off" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:border-teal-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mot de passe</label>
                <input type="password" name="password" required autocomplete="off" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:border-teal-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm rounded-xl shadow-lg transition">
                Se connecter
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
            Vous n'avez pas encore de compte ?
            <a href="{% url 'users:register' %}" class="font-bold text-teal-600 hover:underline">Créer un compte</a>
        </div>
    </div>
</div>
{% endblock %}
