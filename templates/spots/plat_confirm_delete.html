{% extends 'base.html' %}

{% block title %}Supprimer le plat - TunisSpot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 text-center">
        <h2 class="text-xl font-black text-slate-900 mb-2">Supprimer ce plat ?</h2>
        <p class="text-xs text-slate-500 mb-6">Êtes-vous sûr de vouloir retirer <b>{{ plat.nom }}</b> du menu ?</p>
        <form method="POST" class="flex items-center justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'spots:spot_detail' plat.lieu.slug %}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600">Annuler</a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow">Supprimer</button>
        </form>
    </div>
</div>
{% endblock %}
