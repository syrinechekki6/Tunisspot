{% extends 'base.html' %}

{% block title %}Supprimer la photo - TunisSpot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 text-center">
        <div class="w-24 h-24 mx-auto mb-4 rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
            <img src="{{ photo.url }}" alt="Photo à supprimer" class="w-full h-full object-cover">
        </div>
        <h2 class="text-xl font-black text-slate-900 mb-2">Supprimer cette photo ?</h2>
        <p class="text-xs text-slate-500 mb-6 leading-relaxed">
            Êtes-vous sûr de vouloir supprimer cette photo associée à <b>{{ photo.lieu.nom }}</b> ?
        </p>
        <form method="POST" class="flex items-center justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'spots:spot_detail' photo.lieu.slug %}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 transition">Annuler</a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow transition">Supprimer la photo</button>
        </form>
    </div>
</div>
{% endblock %}
