{% extends 'base.html' %}

{% block title %}Supprimer l'itinéraire - TunisSpot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 text-center">
        <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-2xl mb-4">
            <i class="fa-solid fa-trash"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900 mb-2">Supprimer cet itinéraire ?</h2>
        <p class="text-xs text-slate-500 mb-6">Êtes-vous sûr de vouloir supprimer définitivement <b>{{ itineraire.titre }}</b> de la base de données ?</p>
        <form method="POST" class="flex items-center justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'itineraries:my_itineraries' %}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">Annuler</a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow">Oui, supprimer</button>
        </form>
    </div>
</div>
{% endblock %}
